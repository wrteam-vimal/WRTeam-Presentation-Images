    system: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
    light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
  };

  const el = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v; // only used with the static ICONS above
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    node.append(...children);
    return node;
  };
  const withIcon = (icon, label) => {
    const span = document.createElement("span");
    span.innerHTML = ICONS[icon];
    return [span.firstChild, document.createTextNode(label)];
  };
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const matches = (file) => !query || (file.title + " " + file.name).toLowerCase().includes(query);
  const visible = (folder) => folder.files.filter(matches);
  const initials = (name) =>
    (name.match(/[A-Za-z0-9]+/g) || ["?"]).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const hue = (name) => [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const avatarStyle = (name) => {
    const h = hue(name);
    return `background:linear-gradient(135deg,hsl(${h} 75% 58%),hsl(${(h + 40) % 360} 75% 52%))`;
  };

  // Stats
  const all = folders.flatMap((f) => f.files);
  const videos = all.filter((f) => f.kind === "Video").length;
  $("stats").textContent =
    `${plural(all.length - videos, "image")}${videos ? " · " + plural(videos, "video") : ""} · ${plural(folders.length, "product")}`;

  // Theme: system -> light -> dark
  const themes = ["system", "light", "dark"];
  const themeBtn = $("theme");
  function applyTheme(t, save) {
    if (t === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    themeBtn.innerHTML = ICONS[t];
    themeBtn.title = `Theme: ${t[0].toUpperCase() + t.slice(1)}`;
    if (!save) return;
    try { t === "system" ? localStorage.removeItem("wrteam-theme") : localStorage.setItem("wrteam-theme", t); } catch {}
  }
  let theme = document.documentElement.dataset.theme || "system";
  applyTheme(theme);
  themeBtn.addEventListener("click", () => applyTheme((theme = themes[(themes.indexOf(theme) + 1) % 3]), true));

  // Clipboard with a fallback for older browsers and non-secure pages.
  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = el("textarea", { style: "position:fixed;opacity:0" });
      area.value = text;
      document.body.append(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
  }
  let toastTimer;
  function toast(message) {
    toastEl.replaceChildren(el("span", { class: "tick", html: ICONS.check }), message);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1900);
  }
  function flash(button, label) {
    const original = [...button.childNodes];
    button.replaceChildren(...withIcon("check", label));
    button.classList.add("done");
    setTimeout(() => {
      button.replaceChildren(...original);
      button.classList.remove("done");
    }, 1400);
  }
  async function copyTag(file, button) {
    await copy(file.tag);
    if (button) flash(button, "Copied");
    toast(`Copied tag for "${file.title}"`);
  }

  function renderTabs() {
    tabsEl.replaceChildren();
    const shown = folders.filter((f) => !folderQuery || f.name.toLowerCase().includes(folderQuery));
    if (!shown.length) {
      tabsEl.append(el("p", { class: "none", text: "No products match." }));
      return;
    }
    const withFiles = shown.filter((f) => visible(f).length);
    const rest = shown.filter((f) => !visible(f).length);
    const addGroup = (label, list) => {
      if (!list.length) return;
      tabsEl.append(el("div", { class: "group" }, el("span", { text: label }), el("span", { text: String(list.length) })));
      for (const folder of list) {
        const n = visible(folder).length;
        const selected = folder.id === active;
        tabsEl.append(
          el(
            "button",
            {
              class: "tab" + (n ? "" : " empty"),
              role: "tab",
              id: "tab-" + folder.id,
              "aria-selected": String(selected),
              "aria-controls": "panel",
              tabindex: selected ? "0" : "-1",
              title: folder.name,
              onclick: () => select(folder.id, true),
            },
            el("span", { class: "avatar", style: avatarStyle(folder.name), "aria-hidden": "true", text: initials(folder.name) }),
            el("span", { class: "name", text: folder.name }),
            el("span", { class: "count", text: String(n) }),
          ),
        );
      }
    };
    addGroup(query ? "Matches" : "Products", withFiles);
    addGroup(query ? "No matches" : "No files yet", rest);
  }

  function card(file, index, list) {
    const thumb = el("button", { class: "thumb", type: "button", "aria-label": `Preview ${file.title}` });
    const loaded = () => thumb.classList.add("loaded");
    const media =
      file.kind === "Video"
        ? el("video", { src: file.url, preload: "metadata", muted: "", playsinline: "", onloadeddata: loaded, onerror: loaded })
        : el("img", { src: file.url, alt: file.title, loading: "lazy", decoding: "async", onload: loaded, onerror: loaded });
    thumb.append(media, el("span", { class: "zoom", html: ICONS.zoom }));
    thumb.addEventListener("click", () => openViewer(list, index));

    const copyBtn = el("button", { class: "btn primary", type: "button" }, ...withIcon("copy", "Copy"));
    copyBtn.addEventListener("click", () => copyTag(file, copyBtn));
    const viewBtn = el("button", { class: "btn", type: "button", title: "View", "aria-label": `View ${file.title}`, html: ICONS.eye });
    viewBtn.addEventListener("click", () => openViewer(list, index));

    return el(
      "article",
      { class: "card", style: `animation-delay:${Math.min(index, 12) * 25}ms` },
      thumb,
      el(
        "div",
        { class: "body" },
        el("h3", { class: "title", text: file.title, title: file.title }),
        el("div", { class: "sub" }, el("span", { class: "badge", text: file.kind }), el("span", { class: "file", text: file.name, title: file.name })),
        el("div", { class: "row" }, copyBtn, viewBtn),
      ),
    );
  }

  function renderPanel() {
    const folder = folders.find((f) => f.id === active);
    panelEl.replaceChildren();
    if (!folder) return;
    panelEl.setAttribute("aria-labelledby", "tab-" + folder.id);
    const files = visible(folder);
    const folderUrl = `${repoUrl}/tree/main/${encodeURIComponent(folder.name)}`;
    const copyAll = el("button", { class: "btn primary", type: "button" }, ...withIcon("stack", `Copy all (${files.length})`));
    copyAll.disabled = !files.length;
    copyAll.addEventListener("click", async () => {
      await copy(files.map((f) => f.tag).join("\n"));
      flash(copyAll, "Copied");
      toast(`Copied ${plural(files.length, "tag")} from ${folder.name}`);
    });
    panelEl.append(
      el(
        "div",
        { class: "hero panel-head" },
        el(
          "div",
          {},
          el("p", { class: "eyebrow", text: "Product" }),
          el("h2", { text: folder.name }),
          el("div", {
            class: "meta",
            text: query ? `${files.length} of ${plural(folder.files.length, "file")} match "${searchEl.value.trim()}"` : plural(folder.files.length, "file"),
          }),
        ),
        el(
          "div",
          { class: "actions" },
          el("a", { class: "btn", href: folderUrl, target: "_blank", rel: "noopener" }, ...withIcon("github", "Open on GitHub")),
          copyAll,
        ),
      ),
    );
    if (files.length) {
      panelEl.append(el("div", { class: "grid" }, ...files.map((f, i) => card(f, i, files))));
    } else {
      panelEl.append(
        el(
          "div",
          { class: "empty-state" },
          el("span", { class: "ill", html: ICONS.folder }),
          el("strong", { text: query ? "No matching files" : "No images yet" }),
          query
            ? el("span", { text: "Try a different search." })
            : el("span", {}, "Upload images to this product folder on GitHub. ",
                el("a", { href: folderUrl, target: "_blank", rel: "noopener", text: "Open folder" })),
        ),
      );
    }
  }

  function select(id, focus) {
    if (!folders.some((f) => f.id === id)) return;
    active = id;
    history.replaceState(null, "", "#" + id);
    renderTabs();
    renderPanel();
    if (focus) $("tab-" + id)?.focus();
  }

  // Lightbox
  function showInViewer() {
    const file = viewList[viewIndex];
    if (!file) return;
    stage.replaceChildren(
      file.kind === "Video"
        ? el("video", { src: file.url, controls: "", autoplay: "", playsinline: "" })
        : el("img", { src: file.url, alt: file.title }),
    );
    if (viewList.length > 1) {
      const prev = el("button", { class: "nav prev", type: "button", "aria-label": "Previous", html: ICONS.left, onclick: () => step(-1) });
      const next = el("button", { class: "nav next", type: "button", "aria-label": "Next", html: ICONS.right, onclick: () => step(1) });
      stage.append(prev, next);
    }
    $("v-title").textContent = file.title;
    $("v-meta").textContent = `${file.kind} · ${file.name} · ${viewIndex + 1} of ${viewList.length}`;
    $("v-open").href = file.url;
  }
  function openViewer(list, index) {
    viewList = list;
    viewIndex = index;
    showInViewer();
    if (!viewer.open) viewer.showModal();
  }
  function step(d) {
    viewIndex = (viewIndex + d + viewList.length) % viewList.length;
    showInViewer();
  }
  $("v-close").addEventListener("click", () => viewer.close());
  $("v-copy").addEventListener("click", (e) => copyTag(viewList[viewIndex], e.currentTarget));
  viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
  viewer.addEventListener("close", () => stage.replaceChildren());
  viewer.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  // Arrow keys move between tabs.
  tabsEl.addEventListener("keydown", (e) => {
    const tabs = [...tabsEl.querySelectorAll(".tab")];
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const next = { ArrowDown: i + 1, ArrowRight: i + 1, ArrowUp: i - 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    const target = tabs[(next + tabs.length) % tabs.length];
    select(target.id.slice(4), true);
  });

  // "/" focuses search; Esc clears it.
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !viewer.open && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      searchEl.focus();
    }
  });
  searchEl.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && searchEl.value) {
      searchEl.value = "";
      searchEl.dispatchEvent(new Event("input"));
    }
  });
  searchEl.addEventListener("input", () => {
    query = searchEl.value.trim().toLowerCase();
    const current = folders.find((f) => f.id === active);
    if (query && current && !visible(current).length) {
      const first = folders.find((f) => visible(f).length);
      if (first) active = first.id;
    }
    renderTabs();
    renderPanel();
  });

  // Product search: filters the sidebar by product name; Esc clears it.
  const folderSearchEl = $("folder-search");
  folderSearchEl.addEventListener("input", () => {
    folderQuery = folderSearchEl.value.trim().toLowerCase();
    renderTabs();
  });
  folderSearchEl.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && folderSearchEl.value) {
      folderSearchEl.value = "";
      folderSearchEl.dispatchEvent(new Event("input"));
    }
    if (e.key === "Enter") {
      const first = tabsEl.querySelector(".tab");
      if (first) select(first.id.slice(4), true);
    }
  });

  window.addEventListener("hashchange", () => select(location.hash.slice(1)));

  const fromHash = location.hash.slice(1);
  const start = folders.find((f) => f.id === fromHash) || folders.find((f) => f.files.length) || folders[0];
  if (start) select(start.id);
})();
</script>
</body>
</html>
