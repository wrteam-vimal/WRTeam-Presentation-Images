name: Update image links

# On every push to main: renames new images/videos to URL-safe names and
# rebuilds the README (GitHub + raw links) so it matches the files. Every
# top-level folder gets its own collapsible table; new or changed files go
# to the top of their folder's table and that folder moves to the top.
#
# Just add, rename or delete images and push (or upload via the GitHub UI).
# A new folder is picked up automatically once it holds a file (git does
# not store empty folders; add a .gitkeep if it has no images yet).
# Titles already in README.md are kept, so you can edit a title by hand.
# No secrets needed: it commits back with the built-in GITHUB_TOKEN, which
# does not re-trigger this workflow.
#
# It also runs every 1 January to roll the copyright year range in LICENSE
# and README.md forward (e.g. "2026" -> "2026-2027").

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (without file contents) so the script can see which
          # files this push changed.
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rename images and rebuild README
        env:
          REPO: ${{ github.repository }}
          BRANCH: main
          BEFORE: ${{ github.event.before }}
        run: python .github/scripts/update_readme.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "README already up to date."
            exit 0
          fi
          git commit -m "Update image links (${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
